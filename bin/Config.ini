; ScreenMemory — настройки. Файл лежит рядом с ScreenMemory.exe (bin\Config.ini)
; и читается при каждом запуске. Формат: «ключ=значение», по строке на ключ;
; строки, начинающиеся с ';' или '#', — комментарии; секции [...] допускаются.
; Значения можно писать в кавычках и с переменными среды (%USERPROFILE%).
; Незнакомые ключи не мешают: в --verbose они попадают в лог.

; Программа, которую нужно запустить и дождаться закрытия её окна ПЕРЕД восстановлением
; (restore). Утилита MultiMonitorTool возвращает рабочий стол на второй монитор-телевизор:
; пока он не «поднялся», восстанавливать раскладку бессмысленно. Для save она не нужна —
; save только записывает то, что видно сейчас, и эту программу не запускает.
; Пустое значение (или нет ключа) — ничего не запускать.
prelaunch=C:\с рабочего стола\My Util\multimonitortool-x64\MultiMonitorTool.exe

; Аргументы командной строки для неё (обычно не нужны — утилита настроена сама).
prelaunch-args=

; Сколько секунд ждать, пока окно программы не закроют. 0 — ждать без ограничения.
; Если время вышло, работа продолжается без ожидания (в отчёте — предупреждение).
prelaunch-timeout=0

; --- Автозапуск (команды AutoSave / AutoRestore / Uninstall, нужны права администратора) ---

; Через сколько минут задача «ScreenMemory AutoSave» повторяет save. По умолчанию 10.
; Значение читается в момент создания задачи: поправили файл — выполните AutoSave снова.
; save не переписывает layout.txt, если раскладка не изменилась, поэтому частые срабатывания
; диск не изнашивают.
AutoSave=10

; Задержка задачи «ScreenMemory AutoRestore» после входа в систему, секунды. По умолчанию 30,
; 0 — без задержки. Нужна, чтобы приложения из автозагрузки успели открыть свои окна сами.
AutoRestoreDelay=45
